[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-dashboard-phase0"
version = "0.1.0"
description = "Phase 0 projection import and Yahoo browser-capture audit"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
browser = ["playwright>=1.55,<2"]

[project.scripts]
fantasy-phase0 = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
